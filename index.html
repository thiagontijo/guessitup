/* ---------- game logic ---------- */
const key=l=>l._k||(l._k=l.lg+'|'+etDate(l.t)+'|'+norm(l.pick)+'|'+norm(l.opp));
const snap=l=>l.sc?{ps:+l.sc[0],os:+l.sc[1],final:!!l.r,state:l.r?'post':(l.st||'in'),det:l.det||'',snap:true}:null;
function margin(l,lv){const k=l.k||'ml';if(k==='spread')return lv.ps+(+l.line||0)-lv.os;if(k==='over')return lv.ps+lv.os-(+l.line);if(k==='under')return(+l.line)-lv.ps-lv.os;if(k==='dc')return lv.ps-lv.os+.5;if(k==='draw')return lv.ps===lv.os?.5:-Math.abs(lv.ps-lv.os);return lv.ps-lv.os}
function legNow(l){const sv=snap(l);
if(l.r==='w')return{st:'won',lv:sv,m:sv?margin(l,sv):1};if(l.r==='l')return{st:'lost',lv:sv,m:sv?margin(l,sv):-1};if(l.r==='v')return{st:'void',lv:sv};
const lv=S.live.get(key(l))||sv;if(!lv)return{st:'pre'};if(lv.off)return{st:'pre',lv,off:true};
const k=l.k||'ml',m=margin(l,lv);
if(lv.final){if(m===0&&(k==='spread'||k==='over'||k==='under'))return{st:'void',lv};return{st:m>0?'won':'lost',lv,m}}
if(lv.state==='in'){if(k==='over'&&m>0)return{st:'won',lv,m};if(k==='under'&&m<0)return{st:'lost',lv,m};return{st:'in',lv,m}}

const st=((c.status||ev.status||{}).type)||{},nm=x=>x.team.shortDisplayName||x.team.displayName||x.team.name,H=nm(h),Aw=nm(a);
const rc=(x,nm)=>{const r=(x.records||[]).find(r=>new RegExp(nm,'i').test(r.name||r.type||''));return r?r.summary:''};
const g={id:ev.id,lg,t:ev.date,neutral:!!c.neutralSite,state:st.state||'pre',detail:st.shortDetail||'',home:{n:H,sc:h.score,rec:rc(h,'overall|total|all'),split:rc(h,'home')},away:{n:Aw,sc:a.score,rec:rc(a,'overall|total|all'),split:rc(a,'road|away')},opts:[]};

const ml=o.moneyline||{};let hm=cur(ml.home),aw=cur(ml.away),dr=cur(ml.draw);
if(!hm&&o.homeTeamOdds&&o.homeTeamOdds.moneyLine)hm={odds:o.homeTeamOdds.moneyLine};if(!aw&&o.awayTeamOdds&&o.awayTeamOdds.moneyLine)aw={odds:o.awayTeamOdds.moneyLine};if(!dr&&o.drawOdds&&o.drawOdds.moneyLine)dr={odds:o.drawOdds.moneyLine};

/* ---------- stats model (from ESPN team numbers, play money only) ---------- */
const ST={},HCA={nba:2.5,wnba:2,ncaab:3,ncaaw:3,nfl:1.5,ncaaf:2.5},TSD={nba:18,wnba:16,ncaab:16,ncaaw:16,nfl:13,ncaaf:17};
const num=v=>{const x=parseFloat(v);return isFinite(x)?x:null};
const recN=s=>{const a=String(s||'').match(/\d+/g);return a?a.reduce((p,x)=>p+(+x),0):0};
function side(s,g,which){const comp=s.header&&s.header.competitions&&s.header.competitions[0],c=comp&&(comp.competitors||[]).find(x=>x.homeAway===which),id=c&&String(c.id||(c.team&&c.team.id));if(!id)return null;
const bs=((s.boxscore&&s.boxscore.teams)||[]).find(x=>x.team&&String(x.team.id)===id),st={};((bs&&bs.statistics)||[]).forEach(x=>{st[x.name]=num(x.value!=null&&x.value!==''?x.value:x.displayValue);st['_'+x.name]=x.displayValue});
const lf=(((s.lastFiveGames||[]).find(x=>x.team&&String(x.team.id)===id))||{}).events||[];let pf5=0,pa5=0,n5=0,w5=0;
for(const e of lf){const hs=num(e.homeTeamScore),as=num(e.awayTeamScore);if(hs==null||as==null)continue;const home=String(e.homeTeamId)===id;pf5+=home?hs:as;pa5+=home?as:hs;n5++;if(e.gameResult==='W')w5++}
const t=g[which],games=recN(t.rec)||null;let spf=st.avgPoints??st.avgGoals??st.totalPointsPerGame??null,spa=st.avgPointsAgainst??st.avgGoalsAgainst??null;
if(spf==null&&st.totalGoals!=null&&games)spf=st.totalGoals/games;if(spa==null&&st.goalsConceded!=null&&games)spa=st.goalsConceded/games;
const l5f=n5?pf5/n5:null,l5a=n5?pa5/n5:null,mix=(a,b)=>a!=null&&b!=null?.65*a+.35*b:(a!=null?a:b);
return{pf:mix(spf,l5f),pa:mix(spa,l5a),spf,spa,n5,w5,streak:st._streak||''}}
function pgrid(lh,la){const f=[1];for(let i=1;i<=12;i++)f[i]=f[i-1]*i;const P=(l,k)=>Math.exp(-l)*Math.pow(l,k)/f[k],G=[];for(let i=0;i<=12;i++)for(let j=0;j<=12;j++)G.push([i,j,P(lh,i)*P(la,j)]);return G}
function buildStats(g,s){const H=side(s,g,'home'),A=side(s,g,'away');if(!H||!A)return{st:'err'};const pr=s.predictor,pred=pr&&pr.homeTeam&&num(pr.homeTeam.gameProjection);

function optModel(g,o){const r=optRaw(g,o);return r==null?null:Math.min(.99,Math.max(.01,.5*r+.5*o.p))}
function optRaw(g,o){const x=ST[g.id];if(!x||x.st!=='ok'||!x.m)return null;const m=x.m,hp=norm(o.pick)===norm(g.home.n);

const gradeOf=e=>e>=8?'A':e>=5?'B':e>=3?'C':'';
let stQ=[],stRun=0,rT=0;const soon=()=>{clearTimeout(rT);rT=setTimeout(()=>{if(S.tab==='bet')render()},180)};

const avs=[av(A,x.A),av(H,x.H)].filter(Boolean);if(avs.length)rows.push('<p><b>'+t('stAvgT')+'</b>'+avs.join('; ')+'</p>');
let best=null;for(const o of g.opts){const mp=optModel(g,o);if(mp==null)continue;const e=(mp-o.p)*100;if(!best||e>best.e)best={o,mp,e}}
rows.push(best&&best.e>=3?'<p class="best"><b>'+t('stBest')+'</b>'+esc(best.o.label)+': '+t('stVs',{m:pc0(best.mp),p:pc0(best.o.p)})+' ('+t('grade',{g:gradeOf(best.e)})+')</p>':(m?'<p class="best">'+t('stFair')+'</p>':''));
return '<div class="stx">'+rows.join('')+'</div>'}

/* ---------- podium ---------- */
function dayProfit(date,id){let s=0;const list=id==='you'?mine().bets.filter(b=>b.date===date):((days().find(d=>d.date===date)||{bets:[]}).bets.filter(b=>b.bot===id));
for(const b of list){const n=betNow(b);if(n.st==='won')s+=b.payout-b.stake;else if(n.st==='lost')s-=b.stake}return s}
function podium(){const A=RUN.map(actor),ret=A.map(a=>a.bank/baseOf(a.id)),ord=A.map((a,i)=>i).sort((i,j)=>ret[j]-ret[i]||i-j);
const cell=(i,r)=>{const a=A[i];return '<div><span class="medal num">'+t('rank',{n:r+1})+'</span>'+avatar(a.id,mood({liveN:0,today:a.bank}),r?40:52)+'<b>'+nameOf(a.id)+'</b><span class="num">'+pct(ret[i])+'</span><small>'+smoney(a.bank)+', '+t('hits')+' '+a.won+'/'+(a.won+a.lost)+'</small><span class="blk" style="height:'+[70,48,32][r]+'px;--c:'+colorOf(a.id)+'"></span></div>'};
const pod='<div class="pod">'+cell(ord[1],1)+cell(ord[0],0)+cell(ord[2],2)+'</div>';
const i4=ord[3],a4=A[i4],fourth='<div class="hrow" data-act="run" data-id="'+a4.id+'">'+avatar(a4.id,'flat',26)+'<span>'+t('rank',{n:4})+' '+nameOf(a4.id)+'<small>'+smoney(a4.bank)+', '+t('hits')+' '+a4.won+'/'+(a4.won+a4.lost)+'</small></span><b class="num">'+pct(ret[i4])+'</b></div>';
const ds=[...new Set(days().map(d=>d.date).concat(mine().bets.map(b=>b.date)))].sort().reverse();
const M=mine(),since=M.start?'<p class="say">'+t('youSince',{d:esc(shortDay(M.start))})+'</p>':'';
return '<div class="day"><h2>'+t('podT')+'</h2><p>'+t('hAll')+'</p></div>'+pod+fourth+since+ds.map(date=>'<section class="hday"><h3>'+esc(cap(dayLabel(date,true)))+'</h3><div class="hgrid">'+RUN.map(id=>'<div>'+avatar(id,'flat',24)+'<b class="num">'+smoney(dayProfit(date,id))+'</b>'+nameOf(id)+'</div>').join('')+'</div></section>').join('')+foot()}

/* ---------- shell ---------- */
const NAV=[['race','tabRace','<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>'],['bet','tabBet','<path d="M4 7a2 2 0 012-2h12a2 2 0 012 2v3a2 2 0 000 4v3a2 2 0 01-2 2H6a2 2 0 01-2-2v-3a2 2 0 000-4z"/><path d="M14 6v12" stroke-dasharray="2 3"/>'],['podium','tabPodium','<path d="M8 21V11h8v10M2 21v-6h6M16 21v-8h6M2 21h20"/>']];
function renderNav(){$('#nav').innerHTML=NAV.map(x=>'<button data-tab="'+x[0]+'"'+(S.tab===x[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+x[2]+'</svg>'+t(x[1])+'</button>').join('')}
function pill(){const el=$('#pill'),tx=$('#pillT');if(!S.data){tx.textContent='…';return}const gs=runnerGames(),live=gs.some(g=>g.r===0),open=gs.filter(g=>g.r!==2);
el.classList.toggle('on',live);let s;if(S.net==='down'&&open.length)s=t('pDown');else if(live)s=t('pLive');else if(open.length){const nx=Math.min(...open.map(g=>g.tms));s=nx>Date.now()?t('pNext',{t:clockLabel(new Date(nx).toISOString())}):t('pSoon')}else s=gs.length?t('pDone'):'…';tx.textContent=s}
function slipBar(){let el=$('#slipb');const n=S.slip.length;document.body.classList.toggle('has-slip',!!n);if(!n){if(el)el.remove();return}
if(!el){el=document.createElement('button');el.id='slipb';el.className='slipb';el.dataset.act='slip';document.body.appendChild(el)}el.innerHTML='<span>'+t('slipBar',{n})+'</span><span>'+t('slipSee')+'</span>'}
function render(){if(!S.data)return;const v=$('#view');v.innerHTML=S.tab==='bet'?betTab():S.tab==='podium'?podium():race();renderNav();pill();slipBar();
if(S.sheet&&S.sheet.k==='run')renderOver();
const tr=v.querySelectorAll('.track[data-x]');if(tr.length)requestAnimationFrame(()=>requestAnimationFrame(()=>tr.forEach(r=>{r.style.setProperty('--x',r.dataset.x+'%');S.px[r.dataset.id]=+r.dataset.x})));hint()}
function sheetHtml(){const s=S.sheet,p=S.pref;if(!s)return'';if(s.k==='run')return runSheet(s.id);if(s.k==='slip')return slipSheet();
if(s.k==='recap')return '<div class="sh"><h3>'+t('rTitle')+'</h3><button class="x" data-act="close" aria-label="'+t('close')+'">✕</button></div>'+s.news.map(x=>{const b=x.b,w=x.st==='won',pf=w?b.payout-b.stake:-b.stake,ttl=b.legs.length>1?t('combo',{n:b.legs.length})+': '+b.legs.map(l=>l.pick).join(' + '):legText(b.legs[0]);return '<div class="rc"><span class="ic '+(w?'good':'bad')+'" aria-hidden="true">'+(w?'✓':'✕')+'</span><div>'+nameOf(b.bot||'you')+': '+esc(ttl)+'</div><span class="num">'+smoney(pf)+'</span></div>'}).join('')+'<button class="btn" data-act="close">'+t('rOk')+'</button>';
const chips=[10,20,50,100];
return '<div class="sh"><h3>'+t('settings')+'</h3><button class="x" data-act="close" aria-label="'+t('close')+'">✕</button></div><h4>'+t('sAmt')+'</h4><div class="rowf">'+chips.map(v=>'<button class="chip'+(p.amt===v?' on':'')+'" data-act="damt" data-v="'+v+'" aria-pressed="'+(p.amt===v)+'">$'+v+'</button>').join('')+'</div><h4>'+t('sLang')+'</h4><div class="rowf">'+[['pt','Português'],['en','English'],['es','Español']].map(x=>'<button class="chip'+(lang===x[0]?' on':'')+'" data-act="lang" data-v="'+x[0]+'" aria-pressed="'+(lang===x[0])+'">'+x[1]+'</button>').join('')+'</div><button class="link" data-act="restart">'+(S.rs?t('sRestart2'):t('sRestart'))+'</button>'}
function renderOver(){const o=$('#over');if(!S.sheet){o.innerHTML='';return}const top=o.firstChild&&$('.sheet',o)?$('.sheet',o).scrollTop:0;o.innerHTML='<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">'+sheetHtml()+'</div></div>';if(top){const s=$('.sheet',o);s.style.animation='none';s.scrollTop=top}else if(o.dataset.open){$('.sheet',o).style.animation='none'}o.dataset.open='1'}
function hint(){let el=$('#hint');const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),alone=navigator.standalone||matchMedia('(display-mode:standalone)').matches,show=!S.pref.hintOff&&!alone&&(ios||S.deferred)&&!S.sheet&&!S.slip.length;
if(!show){if(el)el.remove();return}if(!el){el=document.createElement('div');el.id='hint';el.className='hint';document.body.appendChild(el)}el.innerHTML=(ios?esc(t('iHint')):'<button class="btn" data-act="install">'+t('iBtn')+'</button>')+'<button class="x" data-act="hintx" aria-label="'+t('close')+'">✕</button>'}

/* ---------- events ---------- */
const closeSheet=()=>{S.sheet=null;S.rs=0;delete $('#over').dataset.open;renderOver();hint()};
const openSheet=sh=>{S.sheet=sh;delete $('#over').dataset.open;renderOver();hint()};
function findOpt(gid,oid){for(const k in S.mk.data){const g=(S.mk.data[k].evs||[]).find(e=>e.id===gid);if(g){const o=g.opts.find(x=>x.id===oid);if(o)return{g,o}}}return null}
document.addEventListener('click',e=>{const tb=e.target.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;if(S.sheet)closeSheet();render();scrollTo(0,0);return}const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,p=S.pref;
if(a==='scrim'){if(e.target===el)closeSheet();return}
if(a==='gear')openSheet({k:'set'});else if(a==='close')closeSheet();
else if(a==='run')openSheet({k:'run',id:el.dataset.id});
else if(a==='slip')openSheet({k:'slip'});
else if(a==='gobet'){closeSheet();S.tab='bet';render();scrollTo(0,0)}
else if(a==='pick'){const f=findOpt(el.dataset.g,el.dataset.o);if(!f)return;const i=S.slip.findIndex(s=>s.o.id===f.o.id);if(i>=0)S.slip.splice(i,1);else{S.slip=S.slip.filter(s=>s.g.id!==f.g.id);S.slip.push(f)}render()}
else if(a==='unpick'){S.slip=S.slip.filter(s=>s.o.id!==el.dataset.o);if(!S.slip.length)closeSheet();else renderOver();render()}
else if(a==='more'){S.mk.open[el.dataset.g]=!S.mk.open[el.dataset.g];render()}
else if(a==='mday'){S.mk.day=+el.dataset.v;render()}
else if(a==='mlg'){S.mk.lg=el.dataset.v;render()}
else if(a==='mkre'){loadMk(true);render()}
else if(a==='samt'){S.slipAmt=+el.dataset.v;renderOver()}
else if(a==='place')placeSlip();
else if(a==='copytxt'){const L=S.slip.map(s=>legText({pick:s.o.pick,k:s.o.k,line:s.o.line})+' ('+s.g.away.n+' @ '+s.g.home.n+', '+clockLabel(s.g.t)+') '+pc0(s.o.p));const txt=(S.slip.length>1?t('combo',{n:S.slip.length})+':\n':'')+L.join('\n');(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(t('copied2'))).catch(()=>toast(txt))}
else if(a==='copy')copyBet(el.dataset.id);
else if(a==='cancel')cancelBet(el.dataset.id);
else if(a==='damt'){p.amt=+el.dataset.v;save();renderOver();render()}
else if(a==='lang'){p.lang=el.dataset.v;setLang(p.lang);save();S.mk.data={};render();renderOver()}
else if(a==='restart'){if(!S.rs){S.rs=1;renderOver()}else{S.mine={start:null,bets:[]};saveMine();S.rs=0;closeSheet();render();toast(t('restarted'))}}
else if(a==='refresh'){tick(2)}
else if(a==='hintx'){p.hintOff=true;save();hint()}
else if(a==='install'&&S.deferred){S.deferred.prompt();S.deferred=null;hint()}});
document.addEventListener('change',e=>{if(e.target.id==='slipIn'){const v=Math.round(+e.target.value);if(v>=1){S.slipAmt=Math.min(v,999999);renderOver()}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick(1)});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.deferred=e;hint()});
setInterval(()=>{if(S.data&&!document.hidden)pill()},3e4);

/* ---------- start ---------- */
async function boot(){S.pref=Object.assign(defPref(),ls(PKEY)||{});S.pref.follow=Object.assign(defPref().follow,S.pref.follow||{});setLang(S.pref.lang||(navigator.language||'en').slice(0,2).toLowerCase());
const fin=ls(FKEY)||{},cut=Date.now()-6*864e5;for(const k in fin)if(fin[k].at>cut){S.fin[k]=fin[k];S.live.set(k,fin[k])}
renderNav();const ok=await loadData();if(!ok){$('#view').innerHTML='<div class="empty"><p>'+t('eLoad')+'</p><button class="btn" data-act="reload">'+t('retry')+'</button></div>';$('#view').addEventListener('click',e=>{if(e.target.closest('[data-act=reload]'))location.reload()});return}
if(!S.pref.since&&lastDay()){S.pref.since=lastDay().date;save()}
render();S.busy=true;try{await refreshLive(true)}catch(e){}S.busy=false;results(true);render();plan();
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}
window.ARENA={mine,S,loadMk,wantStats,optModel,okBet,ymdOf,clockLabel,ST,actor,betNow,legNow,betProb,tick,debug:()=>({net:S.net,tab:S.tab,lang,bots:IDS.map(actor),you:actor('you'),live:[...S.live].map(([k,v])=>[k,v.state,v.ps,v.os,v.per,v.clock,v.final])})};
boot();
})();
