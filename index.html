if(lv.state==='in'){if(k==='over'&&m>0)return{st:'won',lv,m};if(k==='under'&&m<0)return{st:'lost',lv,m};return{st:'in',lv,m}}

function betNow(b){const ls=b.legs.map(legNow),any=s=>ls.some(x=>x.st===s);let st;

function minsLeft(sp,lv){if(sp.soc)return Math.max(.5,90-(parseInt(lv.clock,10)||0));if(!sp.per)return null;const c=String(lv.clock||'0');let mm;if(c.includes(':')){const a=c.split(':');mm=(+a[0]||0)+(+a[1]||0)/60}else mm=(+c||0)/60;if(lv.per>sp.per)return Math.max(.2,mm);return Math.max(.2,(sp.per-Math.max(1,lv.per))*sp.len+mm)}

function legText(l){const k=l.k||'ml';if(k==='spread')return l.pick+' '+(l.line>0?'+':'')+l.line;if(k==='over')return t('over',{x:l.line});if(k==='under')return t('under',{x:l.line});if(k==='dc')return t('dc',{x:l.pick});return t('wins',{x:l.pick})}

/* ---------- live scores ---------- */
async function board(lg,date,variant){const sp=sport(lg);let q='?dates='+date;if(variant==='all')q+='&groups='+sp.col+'&limit=500';else if(variant)q+='&groups='+variant+'&limit=300';
const r=await fetch(API+sp.p+'/scoreboard'+q,{cache:'no-store'});if(!r.ok)throw new Error('http '+r.status);return(await r.json()).events||[]}
function teamIs(tm,N){if(!tm)return false;return[tm.abbreviation,tm.name,tm.shortDisplayName,tm.location,tm.displayName].some(x=>x&&norm(x)===N)}
function findGame(evs,g){const P=norm(g.l.pick),O=norm(g.l.opp);let best=null;
for(const ev of evs){const c=ev.competitions&&ev.competitions[0],cs=c&&c.competitors;if(!cs||cs.length!==2)continue;const i=cs.findIndex(x=>teamIs(x.team,P));if(i<0)continue;const o=cs[1-i],strong=!O||teamIs(o.team,O),d=Math.abs(Date.parse(ev.date)-g.tms);
if(!best||(strong&&!best.strong)||(strong===best.strong&&d<best.d))best={ev,c,me:cs[i],o,strong,d}}
return best&&(best.strong||best.d<36e5*6)?best:null}
function apply(evs,games){const rest=[];for(const g of games){const m=findGame(evs,g);if(!m){rest.push(g);continue}const st=m.c.status||m.ev.status||{},ty=st.type||{};
const lv={state:ty.state||'pre',final:!!ty.completed,name:ty.name||'',per:st.period|0,clock:st.displayClock||'',detail:ty.shortDetail||'',ps:+m.me.score||0,os:+m.o.score||0,off:/POSTPONED|CANCELED|SUSPENDED/.test(ty.name||''),at:Date.now()};

function openGames(){const m=new Map(),ds=days().slice(-4);for(const d of ds)for(const g of gamesOf(d)){if(g.l.r||S.fin[g.k]||!sport(g.l.lg))continue;m.set(g.k,g)}return[...m.values()]}

const groups=new Map();for(const g of due){const k=g.l.lg+'|'+etDate(g.l.t);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(g)}
let ok=0,fail=0;await Promise.all([...groups].map(async([k,gs])=>{const[lg,date]=k.split('|'),sp=sport(lg);try{let rest=apply(await board(lg,date,''),gs);

const late=rest.filter(g=>new Date(g.l.t).getUTCHours()<10&&new Date(g.l.t).getUTCHours()>=4);if(late.length){const d=new Date(Date.parse(late[0].l.t)-864e5);apply(await board(lg,etDate(d.toISOString()),''),late).forEach(g=>S.miss[g.k]=now);rest.filter(g=>!late.includes(g)).forEach(g=>S.miss[g.k]=now)}else rest.forEach(g=>S.miss[g.k]=now);ok++}catch(e){fail++}}));
S.net=fail&&!ok?'down':'ok'}

if(news.some(x=>x.st==='won'&&p.follow[x.b.bot]))confetti()}

const badge=st=>'<span class="bdg '+(BL[st]||'')+'">'+(BI[st]?'<span class="ic '+(BL[st]||'')+'" aria-hidden="true">'+BI[st]+'</span>':'')+t('b_'+st)+'</span>';
function legIcon(n){let ic='·',cl='',a='a_pre';if(n.st==='won'){ic='✓';cl='good';a='a_won'}else if(n.st==='lost'){ic='✕';cl='bad';a='a_lost'}else if(n.st==='void'){ic='–';a='b_void'}else if(n.st==='in'){ic=n.m>0?'▲':n.m<0?'▼':'=';cl=n.m>0?'good':n.m<0?'bad':'';a=n.m>0?'a_good':n.m<0?'a_bad':'a_tie'}return{ic,cl,a:t(a)}}
const hasScore=n=>!!(n.lv&&(n.lv.state==='in'||n.lv.state==='post'||n.lv.final));
const scoreHtml=(l,n)=>'<b>'+esc(l.pick)+'</b>'+(hasScore(n)?'<span class="num">'+n.lv.ps+'</span><span class="x">x</span><span class="num">'+n.lv.os+'</span>':'<span class="x">x</span>')+'<span>'+esc(l.opp)+'</span>';
function nice(x){for(const s of[.02,.03,.05,.08,.1,.15,.2,.3,.5,1,2,5])if(s>=x*1.15)return s;return 10}
function foot(){const u=S.data.updated?new Date(S.data.updated).toLocaleString(LOC[lang],{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'';
return '<footer class="foot"><details><summary>'+t('howT')+'</summary><ul><li>'+t('how1')+'</li><li>'+t('how2')+'</li><li>'+t('how3')+'</li><li>'+t('how4')+'</li></ul><p>'+t('f2')+'</p><p>'+t('f3')+' <a href="https://github.com/thiagontijo/guessitup" target="_blank" rel="noopener">github.com/thiagontijo/guessitup</a></p>'+(u?'<p>'+t('upd',{t:esc(u)})+'</p>':'')+'</details><p>'+t('fShort')+'</p></footer>'}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function delta(x){const r=Math.round(x),c=r>0?'good':r<0?'bad':'';return (r?'<span class="ic '+c+'" aria-hidden="true">'+(r>0?'▲':'▼')+'</span>':'')+t('dToday',{a:smoney(x)})}
function arena(){const day=lastDay();if(!day)return '<p class="empty">'+t('noBets')+'</p>'+foot();
const bank=S.data.bank||1000,you=actor('you'),gs=gamesOf(day),ns=gs.map(g=>legNow(g.l)),done=gs.filter((g,i)=>isFinal(g.l,ns[i])).length;
const rows=IDS.map(id=>{const a=actor(id);return '<button class="row" data-act="bot" data-bot="'+id+'">'+avatar(id,mood(a),40)+'<span class="nm"><b>'+BOTS[id].n+'</b><small>'+t('s_'+id)+'</small></span><span class="vl"><b class="num">'+money(bank+a.bank+a.proj)+'</b><small>'+delta(a.today+a.proj)+(a.liveN?'<i class="lv" role="img" aria-label="'+t('liveNow')+'"></i>':'')+'</small></span></button>'}).join('');
const me='<button class="row me" data-act="gear">'+avatar('you',mood(you),40)+'<span class="nm"><b>'+t('you')+'</b><small>'+t('youSub',{a:money(S.pref.base)})+'</small></span><span class="vl"><b class="num">'+smoney(you.today+you.proj)+'</b><small>'+t('youTot',{a:smoney(you.bank)})+'</small></span></button>';
return '<div class="day"><h2>'+esc(cap(dayLabel(day.date,true)))+'</h2><p>'+(gs.length?t('gamesDone',{a:done,b:gs.length}):t('noGames'))+'</p></div><div class="board">'+rows+'</div>'+me+'<p class="tip">'+t('tapBot')+'</p>'+foot()}
const legend=()=>'<div class="legend">'+IDS.map(id=>'<span><i class="dot" style="background:'+BOTS[id].hex+'"></i>'+BOTS[id].n+'</span>').join('')+'</div>';
function games(){const day=lastDay();if(!day)return '<p class="empty">'+t('noBets')+'</p>'+foot();const gs=gamesOf(day);
return '<h2 class="ttl2">'+t('games')+'</h2>'+legend()+(gs.length?gs.map(g=>{const n=legNow(g.l),li=legIcon(n);return '<div class="game"><div class="sc">'+scoreHtml(g.l,n)+'</div><div class="when'+(n.st==='in'?' on':'')+'">'+esc(when(g.l,n))+'</div><div class="riders">'+g.bots.map(b=>'<i class="dot" style="background:'+BOTS[b].hex+'"></i>').join('')+'<span class="vh">'+g.bots.map(b=>BOTS[b].n).join(', ')+'</span>'+(n.st!=='pre'?'<span class="bdg"><span class="ic '+li.cl+'" aria-hidden="true">'+li.ic+'</span>'+li.a+'</span>':'')+'</div></div>'}).join(''):'<p class="empty">'+t('noGames')+'</p>')+foot()}
function legRow(l,n){const li=legIcon(n),k=l.k||'ml';return '<div class="leg"><span class="ic '+li.cl+'" role="img" aria-label="'+li.a+'">'+li.ic+'</span><span class="sc">'+scoreHtml(l,n)+(k!=='ml'?'<i class="k">'+esc(legText(l))+'</i>':'')+'</span><span class="wh'+(n.st==='in'?' on':'')+'">'+esc(when(l,n))+'</span></div>'}
function ticket(b){const n=betNow(b),p=betProb(b,n),st=n.st,fin=st==='won'||st==='lost'||st==='void',title=b.legs.length>1?t('combo',{n:b.legs.length}):legText(b.legs[0]);
const right=fin?'<span><small>'+t('result')+'</small><b class="num">'+smoney(st==='won'?b.payout-b.stake:st==='lost'?-b.stake:0)+'</b></span>':'<span><small>'+(n.live||st==='part'?t('chNow'):t('chPre'))+'</small><b class="num">'+(p==null?'–':pc0(p))+'</b></span>';
return '<article class="tk"><div class="ttl"><b>'+esc(title)+'</b>'+badge(st)+'</div>'+b.legs.map((l,i)=>legRow(l,n.ls[i])).join('')+'<div class="mon"><span>'+t('stake')+' <b>'+money(b.stake)+'</b>, '+t('pays')+' <b>'+money(b.payout)+'</b></span>'+right+'</div></article>'}
function botSheet(id){const day=lastDay(),a=actor(id),bank=S.data.bank||1000,list=day?day.bets.filter(b=>b.bot===id):[],say=day&&day.say&&day.say[id],skip=day&&day.skip&&day.skip[id];
return '<div class="sh"><div class="bh">'+avatar(id,mood(a),44)+'<div><h3>'+BOTS[id].n+'</h3><p>'+t('s_'+id)+', '+t('r_'+id)+'</p></div></div><button class="x" data-act="close" aria-label="'+t('close')+'">✕</button></div>'
+'<div class="kpi"><div><small>'+t('bank')+'</small><b class="num">'+money(bank+a.bank+a.proj)+'</b></div><div><small>'+t('today')+'</small><b class="num">'+smoney(a.today+a.proj)+'</b></div><div><small>'+t('hits')+'</small><b class="num">'+a.won+'/'+(a.won+a.lost)+'</b></div></div>'
+(say?'<p class="say">“'+esc(tr3(say))+'”</p>':'')+list.map(ticket).join('')+(!list.length?'<p class="pass">'+t('passed')+(skip?': '+esc(tr3(skip)):'.')+'</p>':'')}
function dayProfit(d,id){let s=0;for(const b of d.bets){if(id==='you'){if(!S.pref.follow[b.bot])continue}else if(b.bot!==id)continue;const k=id==='you'?S.pref.base/b.stake:1,n=betNow(b);if(n.st==='won')s+=(b.payout-b.stake)*k;else if(n.st==='lost')s-=b.stake*k}return s}
function hist(){if(!days().length)return '<p class="empty">'+t('noBets')+'</p>'+foot();const bank=S.data.bank||1000;
const tot=IDS.map(id=>{const a=actor(id);return '<button class="hrow" data-act="bot" data-bot="'+id+'">'+avatar(id,'flat',26)+'<span>'+BOTS[id].n+'<small>'+t('hits')+' '+a.won+'/'+(a.won+a.lost)+'</small></span><b class="num">'+pct(a.bank/bank)+'</b></button>'}).join('');
const ds=[...days()].reverse().map(d=>'<section class="hday"><h3>'+esc(cap(dayLabel(d.date,true)))+'</h3><div class="hgrid">'+IDS.concat('you').map(id=>'<div>'+avatar(id,'flat',24)+'<b class="num">'+smoney(dayProfit(d,id))+'</b>'+(id==='you'?t('you'):BOTS[id].n)+'</div>').join('')+'</div></section>').join('');
return '<h2 class="ttl2">'+t('hAll')+'</h2>'+tot+ds+foot()}
const NAV=[['arena','tabArena','<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],['games','tabGames','<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/>'],['hist','tabHist','<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4M12 8v4l3 2"/>']];
function renderNav(){$('#nav').innerHTML=NAV.map(x=>'<button data-tab="'+x[0]+'"'+(S.tab===x[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+x[2]+'</svg>'+t(x[1])+'</button>').join('')}
function pill(){const el=$('#pill'),tx=$('#pillT'),day=S.data&&lastDay();if(!day){tx.textContent='…';return}const gs=gamesOf(day),ns=gs.map(g=>legNow(g.l)),live=ns.some(n=>n.st==='in'||(n.lv&&n.lv.state==='in'&&!n.lv.final)),open=gs.filter((g,i)=>!isFinal(g.l,ns[i]));
el.classList.toggle('on',live);let s;if(S.net==='down'&&open.length)s=t('pDown');else if(live){const sec=Math.max(0,Math.ceil((S.nextAt-Date.now())/1e3));s=t('pLive')}else if(open.length){const nx=Math.min(...open.map(g=>g.tms));s=nx>Date.now()?t('pNext',{t:clockLabel(new Date(nx).toISOString())}):t('pSoon')}else s=gs.length?t('pDone'):'…';tx.textContent=s}
function render(){if(!S.data)return;const v=$('#view');v.innerHTML=S.tab==='games'?games():S.tab==='hist'?hist():arena();renderNav();pill();if(S.sheet&&S.sheet.k==='bot')renderOver();hint()}
function sheetHtml(){const s=S.sheet,p=S.pref;if(!s)return'';if(s.k==='bot')return botSheet(s.id);
if(s.k==='recap')return '<div class="sh"><h3>'+t('rTitle')+'</h3><button class="x" data-act="close" aria-label="'+t('close')+'">✕</button></div>'+s.news.map(x=>{const b=x.b,w=x.st==='won',pf=w?b.payout-b.stake:-b.stake,k=p.base/b.stake,ttl=b.legs.length>1?t('combo',{n:b.legs.length})+': '+b.legs.map(l=>l.pick).join(' + '):legText(b.legs[0]);return '<div class="rc"><span class="ic '+(w?'good':'bad')+'" aria-hidden="true">'+(w?'✓':'✕')+'</span><div>'+BOTS[b.bot].n+': '+esc(ttl)+(p.follow[b.bot]?'<small>'+t('rYou',{a:smoney(pf*k)})+'</small>':'')+'</div><span class="num">'+smoney(pf)+'</span></div>'}).join('')+'<button class="btn" data-act="close">'+t('rOk')+'</button>';
const chips=[10,20,50,100,200],first=days().length?days()[0].date:null;
return '<div class="sh"><h3>'+t('settings')+'</h3><button class="x" data-act="close" aria-label="'+t('close')+'">✕</button></div><h4>'+t('sFollow')+'</h4><div class="rowf">'+IDS.map(id=>'<button class="tog'+(p.follow[id]?' on':'')+'" data-act="follow" data-bot="'+id+'" aria-pressed="'+!!p.follow[id]+'">'+avatar(id,'flat',28)+'<span>'+BOTS[id].n+'</span><span class="ck" aria-hidden="true">'+(p.follow[id]?'✓':'')+'</span></button>').join('')+'</div><h4>'+t('sBase')+'</h4><div class="rowf">'+chips.map(v=>'<button class="chip'+(p.base===v?' on':'')+'" data-act="base" data-v="'+v+'" aria-pressed="'+(p.base===v)+'">$'+v+'</button>').join('')+'<label class="chip in'+(chips.includes(p.base)?'':' on')+'"><span>$</span><input id="baseIn" inputmode="numeric" pattern="[0-9]*" maxlength="6" value="'+(chips.includes(p.base)?'':p.base)+'" placeholder="'+t('other')+'" aria-label="'+t('sBase')+'"></label></div>'+(first&&p.since&&first<p.since?'<h4>'+t('sSince')+'</h4><div class="rowf col"><button class="chip'+(!p.all?' on':'')+'" data-act="since" data-v="0" aria-pressed="'+!p.all+'">'+t('sinceMine',{d:esc(shortDay(p.since))})+'</button><button class="chip'+(p.all?' on':'')+'" data-act="since" data-v="1" aria-pressed="'+!!p.all+'">'+t('sinceAll')+'</button></div>':'')+'<h4>'+t('sLang')+'</h4><div class="rowf">'+[['pt','Português'],['en','English'],['es','Español']].map(x=>'<button class="chip'+(lang===x[0]?' on':'')+'" data-act="lang" data-v="'+x[0]+'" aria-pressed="'+(lang===x[0])+'">'+x[1]+'</button>').join('')+'</div><button class="link" data-act="reset">'+t('sReset')+'</button>'}
function renderOver(){const o=$('#over');if(!S.sheet){o.innerHTML='';return}const top=o.firstChild&&$('.sheet',o)?$('.sheet',o).scrollTop:0;o.innerHTML='<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">'+sheetHtml()+'</div></div>';if(top){const s=$('.sheet',o);s.style.animation='none';s.scrollTop=top}else if(o.dataset.open){$('.sheet',o).style.animation='none'}o.dataset.open='1'}
function hint(){let el=$('#hint');const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),alone=navigator.standalone||matchMedia('(display-mode:standalone)').matches,show=!S.pref.hintOff&&!alone&&(ios||S.deferred)&&!S.sheet;
if(!show){if(el)el.remove();return}if(!el){el=document.createElement('div');el.id='hint';el.className='hint';document.body.appendChild(el)}el.innerHTML=(ios?esc(t('iHint')):'<button class="btn" data-act="install">'+t('iBtn')+'</button>')+'<button class="x" data-act="hintx" aria-label="'+t('close')+'">✕</button>'}

/* ---------- events ---------- */
function setBase(v){v=Math.round(+v);if(!(v>=1))return;S.pref.base=Math.min(v,999999);save();render()}
document.addEventListener('click',e=>{const tb=e.target.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;render();scrollTo(0,0);return}const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,p=S.pref;
if(a==='scrim'){if(e.target===el){S.sheet=null;delete $('#over').dataset.open;renderOver();hint()}return}
if(a==='gear'){S.sheet={k:'set'};renderOver();hint()}else if(a==='close'){S.sheet=null;delete $('#over').dataset.open;renderOver();hint()}
else if(a==='follow'){p.follow[el.dataset.bot]=!p.follow[el.dataset.bot];save();render();renderOver()}
else if(a==='base'){setBase(el.dataset.v);renderOver()}
else if(a==='since'){p.all=el.dataset.v==='1';save();render();renderOver()}
else if(a==='lang'){p.lang=el.dataset.v;setLang(p.lang);save();render();renderOver()}
else if(a==='reset'){const keep={lang:p.lang};S.pref=Object.assign(defPref(),keep,{since:lastDay()?lastDay().date:null,init:true,seen:p.seen});save();render();renderOver()}
else if(a==='refresh'){tick(2)}
else if(a==='bot'){S.sheet={k:'bot',id:el.dataset.bot};delete $('#over').dataset.open;renderOver();hint()}
else if(a==='hintx'){p.hintOff=true;save();hint()}
else if(a==='install'&&S.deferred){S.deferred.prompt();S.deferred=null;hint()}});
document.addEventListener('change',e=>{if(e.target.id==='baseIn'){setBase(e.target.value);renderOver()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;delete $('#over').dataset.open;renderOver();hint()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick(1)});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.deferred=e;hint()});
setInterval(()=>{if(S.data&&!document.hidden)pill()},3e4);

/* ---------- start ---------- */
async function boot(){S.pref=Object.assign(defPref(),ls(PKEY)||{});S.pref.follow=Object.assign(defPref().follow,S.pref.follow||{});setLang(S.pref.lang||(navigator.language||'en').slice(0,2).toLowerCase());
const fin=ls(FKEY)||{},cut=Date.now()-6*864e5;for(const k in fin)if(fin[k].at>cut){S.fin[k]=fin[k];S.live.set(k,fin[k])}
renderNav();const ok=await loadData();if(!ok){$('#view').innerHTML='<div class="empty"><p>'+t('eLoad')+'</p><button class="btn" data-act="reload">'+t('retry')+'</button></div>';$('#view').addEventListener('click',e=>{if(e.target.closest('[data-act=reload]'))location.reload()});return}
if(!S.pref.since&&lastDay()){S.pref.since=lastDay().date;save()}
render();S.busy=true;try{await refreshLive(true)}catch(e){}S.busy=false;results(true);render();plan();
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}
window.ARENA={S,actor,betNow,legNow,betProb,tick,debug:()=>({net:S.net,tab:S.tab,lang,bots:IDS.map(actor),you:actor('you'),live:[...S.live].map(([k,v])=>[k,v.state,v.ps,v.os,v.per,v.clock,v.final])})};
boot();
})();
</script>
