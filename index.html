@font-face{font-family:"Big Shoulders";src:url(fonts/bsd-800.woff2) format("woff2");font-weight:800;font-style:normal;font-display:swap}
@property --x{syntax:"<percentage>";inherits:true;initial-value:50%}
:root{--plane:#0e1330;--surface:#171e45;--surface2:#232d63;--hair:rgba(241,239,230,.13);--chalk:#f1efe6;--ink:#f1efe6;--ink2:#c9cde6;--mute:#8f97c4;
--chico:#3987e5;--arnaldo:#199e70;--herman:#d95926;--you:#9085e9;--good:#0ca30c;--bad:#d03b3b;--who:92px;--val:80px}
*{box-sizing:border-box;margin:0}
html{background:var(--plane);-webkit-text-size-adjust:100%}
body{color:var(--ink);font:400 15px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100dvh;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;border-radius:8px}
h1,h2,h3,.num{font-family:"Big Shoulders",ui-rounded,system-ui,sans-serif;font-weight:800;line-height:1.05;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

.top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:color-mix(in srgb,var(--plane) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.top .in{max-width:488px;margin:0 auto;display:flex;align-items:center;gap:8px}
.top h1{font-size:24px;flex:1;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 13px;border-radius:19px;background:var(--surface);border:1px solid var(--hair);font-size:13px;color:var(--ink2);white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.pill.on{color:var(--ink)}
.pill.on .dot{background:var(--chalk);animation:pulse 1.5s ease-in-out infinite}
.gear{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--hair);display:grid;place-items:center;flex:none}
.gear svg{width:19px;height:19px}

.hero .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.hero h2{font-size:34px}
.hero .hd p{font-size:13px;color:var(--ink2);text-align:right}
.axis{display:grid;grid-template-columns:var(--who) 1fr var(--val);font-size:11px;color:var(--mute)}
.axis div{grid-column:2;display:flex;justify-content:space-between}
.lane{display:grid;grid-template-columns:var(--who) 1fr var(--val);align-items:center;width:100%;min-height:54px}
.lane .who b{display:block;font-weight:600;font-size:15px}
.lane .who small{font-size:12px;color:var(--mute)}
.rail{position:relative;height:54px;transition:--x .9s cubic-bezier(.2,.8,.2,1)}
.rail::before{content:"";position:absolute;left:0;right:0;top:calc(50% - 1px);height:2px;background:rgba(241,239,230,.08);border-radius:2px}
.rail::after{content:"";position:absolute;left:calc(50% - 1px);top:0;bottom:0;border-left:2px dashed rgba(241,239,230,.38)}
.bar{position:absolute;top:calc(50% - 3px);height:6px;left:min(50%,var(--x));width:max(calc(var(--x) - 50%),calc(50% - var(--x)));background:var(--c);border-radius:4px}
.tok{position:absolute;top:50%;left:var(--x);width:34px;height:34px;transform:translate(-50%,-50%);z-index:1}
.tok .av{display:block;filter:drop-shadow(0 0 0 var(--surface));stroke:none}
.tok::before{content:"";position:absolute;inset:-2px;border-radius:14px;background:var(--surface);z-index:-1}
.lane .val{text-align:right}
.lane .val .num{font-size:24px;display:block}
.lane .val small{font-size:12px;color:var(--ink2)}
.lv{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--chalk);margin-left:5px;vertical-align:middle;animation:pulse 1.5s ease-in-out infinite}
table.st{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.st th{font-weight:400;color:var(--mute);text-align:right;padding:8px 0 5px;font-size:12px}
.st td{padding:8px 0;border-top:1px solid var(--hair);text-align:right;font-variant-numeric:tabular-nums}
.st th:first-child,.st td:first-child{text-align:left}
.st td:first-child{font-weight:600}

.sec{margin-top:26px}
.sec>h3{font-size:24px;margin-bottom:6px}
.game{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 0;border-top:1px solid var(--hair)}
.game:first-of-type{border-top:0}
.sc{display:flex;align-items:baseline;gap:7px;font-size:15px;min-width:0;flex-wrap:wrap}
.sc b{font-weight:600}
.sc .num{font-size:22px}
.x{color:var(--mute);font-size:12px}
.when{font-size:13px;color:var(--ink2);text-align:right;align-self:center;white-space:nowrap}
.when.on,.wh.on{color:var(--ink)}
.riders{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rider{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);padding:3px 9px 3px 3px;border-radius:12px;background:var(--surface)}
.bdg{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:10px;background:var(--surface2);color:var(--ink);white-space:nowrap}
.bdg.good{background:color-mix(in srgb,var(--good) 30%,var(--surface))}
.bdg.bad{background:color-mix(in srgb,var(--bad) 34%,var(--surface))}
.game .bdg{background:transparent;padding-left:0}
.ic{font-size:11px;line-height:1}
.ic.good{color:#35c535}
.ic.bad{color:#f06a6a}

.you{border:2px dashed rgba(241,239,230,.3);border-radius:22px;padding:16px 14px}
.yh{display:flex;align-items:center;gap:10px}
.yh div{flex:1;min-width:0}
.yh h3{font-size:24px}
.yh p,.you .fl,.you .cnt{font-size:13px;color:var(--ink2)}
.you .fl{margin-top:10px}
.btn{min-height:40px;padding:0 16px;border-radius:20px;background:var(--chalk);color:var(--plane);font-weight:600;font-size:14px;flex:none}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 10px}
.yn .num{font-size:34px;display:block}
.yn small{font-size:12px;color:var(--ink2);display:block;margin-top:3px}

.bot{margin-top:24px}
.bot:first-child{margin-top:8px}
.bh{display:flex;gap:11px;align-items:center;margin-bottom:10px}
.bh h3{font-size:28px}
.bh p{font-size:13px;color:var(--ink2)}
.say{font-size:14px;color:var(--ink);margin:0 0 10px;padding:10px 13px;background:var(--surface2);border-radius:4px 16px 16px 16px;max-width:34em}
.say.re{background:transparent;border:1px solid var(--hair);color:var(--ink2)}
.tk{background:var(--surface);border-radius:14px;margin-bottom:10px;border-left:5px solid var(--c);overflow:hidden}
.tk .up{padding:13px 14px 9px}
.ttl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.ttl b{font-size:16px;font-weight:600}
.leg{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:baseline;padding:5px 0;font-size:14px}
.leg .ic{text-align:center}
.leg .num{font-size:18px}
.leg .k{font-style:normal;color:var(--ink2);font-size:12px}
.wh{font-size:12px;color:var(--ink2);white-space:nowrap}
.perf{position:relative;height:0;border-top:2px dashed var(--plane);margin:0 12px}
.perf::before,.perf::after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--plane)}

.perf::after{right:-20px}

.dn .num{font-size:22px}
.me{grid-column:1/-1;font-size:13px;color:var(--ink2);padding-top:10px;border-top:1px solid var(--hair);display:flex;gap:8px;align-items:center}

.hrow small{display:block;color:var(--mute);font-size:12px}
.hrow .num{font-size:18px;text-align:right}
.hsum{font-size:13px;color:var(--ink2);margin-bottom:6px}

.foot{margin-top:30px;font-size:13px;color:var(--mute)}

.foot details{color:var(--ink2);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:12px 0}
.foot summary{font-weight:600;color:var(--ink);cursor:pointer;min-height:24px}
.foot li{margin:8px 0 0 18px}
.empty{padding:40px 8px;text-align:center;color:var(--ink2)}

.hint .btn{background:var(--plane);color:var(--chalk);margin-top:8px}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(6,9,26,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh{display:flex;align-items:center;justify-content:space-between}
.sh h3{font-size:26px}
.sh .x{width:44px;height:44px;text-align:center;font-size:18px;color:var(--ink2)}
.sheet h4{font-size:13px;font-weight:400;color:var(--ink2);margin:18px 0 8px}
.rowf{display:flex;gap:8px;flex-wrap:wrap}
.rowf.col{flex-direction:column}
.tog,.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--hair);font-size:14px;color:var(--ink2)}
.tog{padding-left:8px}
.tog.on,.chip.on{border-color:var(--chalk);color:var(--ink);background:var(--surface2)}
.tog .ck{width:18px;text-align:center}
.chip.in{padding-right:6px}
.chip.in input{width:74px;background:none;border:0;color:var(--ink);font:inherit;font-size:16px;outline:0}
.link{margin-top:22px;color:var(--ink2);text-decoration:underline;font-size:14px;min-height:44px}
.rc{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--hair);font-size:14px}
.rc small{display:block;color:var(--ink2);font-size:12px}
.sheet .btn{margin-top:16px;width:100%;text-align:center}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);z-index:50;background:var(--chalk);color:var(--plane);padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:up .25s ease-out;max-width:calc(100% - 32px)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- live scores ---------- */
async function board(lg,date,variant){const sp=sport(lg);let q='?dates='+date;if(variant==='all')q+='&groups='+sp.col+'&limit=500';else if(variant)q+='&groups='+variant+'&limit=300';

return best&&(best.strong||best.d<36e5*6)?best:null}

if(news.some(x=>x.st==='won'&&p.follow[x.b.bot]))confetti()}

function bets(){const day=lastDay();if(!day)return '<p class="empty">'+t('noBets')+'</p>'+foot();

const NAV=[['arena','tabArena','<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],['bets','tabBets','<path d="M4 7a2 2 0 012-2h12a2 2 0 012 2v3a2 2 0 000 4v3a2 2 0 01-2 2H6a2 2 0 01-2-2v-3a2 2 0 000-4z"/><path d="M14 6v12" stroke-dasharray="2 3"/>'],['hist','tabHist','<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>']];

function pill(){const el=$('#pill'),tx=$('#pillT'),day=S.data&&lastDay();if(!day){tx.textContent='…';return}const gs=gamesOf(day),ns=gs.map(g=>legNow(g.l)),live=ns.some(n=>n.st==='in'||(n.lv&&n.lv.state==='in'&&!n.lv.final)),open=gs.filter((g,i)=>!isFinal(g.l,ns[i]));
